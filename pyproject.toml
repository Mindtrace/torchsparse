[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "torch @ https://download.pytorch.org/whl/cu121/torch-2.2.0%2Bcu121-cp312-cp312-linux_x86_64.whl",
    "ninja>=1.10.0",
    "numpy>=1.20.0,<2.0.0",  # Explicitly pin numpy to 1.x
    "pybind11>=2.12.0",  # Add pybind11 for numpy 2.x compatibility
]
build-backend = "setuptools.build_meta"
